info:
  name: Last recorded mileage for car
  type: http
  seq: 12

http:
  method: GET
  url: http://localhost:8000/cars/:plate_number/last-mileage
  headers:
    - name: Authorization
      value: Bearer {{FLEET_API_KEY}}
  params:
    - name: plate_number
      value: BAA%201234
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
