info:
  name: Updates driver
  type: http
  seq: 17

http:
  method: PATCH
  url: http://localhost:8000/drivers/:driver_id
  headers:
    - name: Authorization
      value: Bearer {{FLEET_API_KEY}}
    - name: Content-Type
      value: application/json
  params:
    - name: driver_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
