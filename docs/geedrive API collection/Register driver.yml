info:
  name: Register driver
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/drivers
  headers:
    - name: Authorization
      value: Bearer {{FLEET_API_KEY}}
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: nrc_file
        type: file
        value:
          - /home/patrick/Downloads/NRC.pdf
      - name: license_file
        type: file
        value:
          - /home/patrick/Downloads/License.pdf
      - name: driver_data
        type: text
        value: '{"first_name": "James", "last_name": "Mwansa", "email": "james.mwansa@example.com", "phone": "+260971000001", "nrc_number": "123456/78/1", "license_number": "DR98765", "license_expiry": "2027-12-31", "next_of_kin_name": "Grace Mwansa", "next_of_kin_relationship": "Spouse", "next_of_kin_phone": "+260971000002", "next_of_kin_email": "grace.mwansa@example.com", "registration_date": "2024-03-01"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
