info:
  name: Filter by drivers name
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:8000/drivers/analytics?name=Mwansa
  headers:
    - name: Authorization
      value: Bearer {{FLEET_API_KEY}}
  params:
    - name: name
      value: Mwansa
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
